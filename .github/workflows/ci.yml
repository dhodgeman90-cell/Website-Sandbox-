name: CI

# Runs on every push to main and on every pull request, so Liquid errors are
# caught before they reach the live store instead of after.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
